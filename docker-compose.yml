services:
  expense-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-backend:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      EXPENSE_HOST: 0.0.0.0
      EXPENSE_PORT: 8000
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 3s
      retries: 3
